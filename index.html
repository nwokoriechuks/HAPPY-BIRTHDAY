<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday | Your Name</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="landing-page">

    <!-- =================================
         BACKGROUND
    ================================== -->

    <div class="landing-background"></div>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>


    <!-- =================================
         DECORATIVE PARTICLES
    ================================== -->

    <div class="particles">

        <span class="particle p1">✦</span>
        <span class="particle p2">✧</span>
        <span class="particle p3">✦</span>
        <span class="particle p4">·</span>
        <span class="particle p5">✧</span>
        <span class="particle p6">✦</span>
        <span class="particle p7">·</span>
        <span class="particle p8">✧</span>

    </div>


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <main class="landing-content">


        <!-- Small top label -->

        <div class="intro-label">

            <span class="label-line"></span>

            <span>
                A SPECIAL DAY
            </span>

            <span class="label-line"></span>

        </div>


        <!-- =================================
             PORTRAIT AREA
        ================================== -->

        <div class="portrait-area">


            <!-- Outer orbit -->

            <div class="orbit orbit-one"></div>

            <div class="orbit orbit-two"></div>


            <!-- Decorative dots -->

            <span class="orbit-dot dot-one"></span>

            <span class="orbit-dot dot-two"></span>


            <!-- Glow -->

            <div class="portrait-glow"></div>


            <!-- Portrait -->

            <div class="portrait-frame">

                <div class="portrait-inner">

                    <img
                        src="ekene/adaarh8.jpg"
                        alt="Birthday celebrant"
                    >

                </div>

            </div>


            <!-- Sparkles -->

            <span class="portrait-sparkle sparkle-one">
                ✦
            </span>

            <span class="portrait-sparkle sparkle-two">
                ✧
            </span>

            <span class="portrait-sparkle sparkle-three">
                ·
            </span>

        </div>


        <!-- =================================
             TEXT
        ================================== -->

        <section class="birthday-text">


            <h2 class="birthday-label">
                HAPPY
            </h2>


            <h1>
                BIRTHDAY
            </h1>


            <h2>
                ANAZONWU EKENE
            </h2>


            <div class="date-line">

                <span></span>

                <p>
                    12 • 09 • 2026
                </p>

                <span></span>

            </div>


            <p class="birthday-subtitle">
                A beautiful day.
                A beautiful person.
                A collection of beautiful memories.
            </p>


        </section>


        <!-- =================================
             CTA
        ================================== -->

        <button
            id="celebrateBtn"
            class="celebrate-btn"
        >

            <span class="button-icon">
                ✨
            </span>

            <span class="button-text">
                Enter the Celebration
            </span>

            <span class="button-arrow">
                →
            </span>

        </button>


        <p class="bottom-hint">
            There's something special waiting for you
        </p>


    </main>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="js/index.js"></script>

</body>

</html>
