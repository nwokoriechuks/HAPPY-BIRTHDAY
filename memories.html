<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memories ✨</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="memories-page">


    <!-- Ambient background -->

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>


    <!-- Center message -->

    <main class="memory-center">

        <p class="memory-eyebrow">
            A COLLECTION OF MOMENTS
        </p>

        <h1>
            Beautiful Memories
        </h1>

        <p>
            Some moments deserve to be remembered forever.
        </p>

    </main>


    <!-- Floating memories -->

    <div
        id="memoryContainer"
        class="memory-container"
    ></div>


    <!-- Continue -->

    <button
        id="continueBtn"
        class="continue-btn"
    >
        Continue
        <span>→</span>
    </button>


    <a
        href="index.html"
        class="back-btn"
    >
        ← Back
    </a>


    <!-- Lightbox -->

    <div
        id="lightbox"
        class="lightbox"
    >

        <button
            id="closeLightbox"
            class="close-lightbox"
        >
            ×
        </button>

        <div id="lightboxContent"></div>

    </div>


    <script src="js/memories.js"></script>

</body>

</html>
